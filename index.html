<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Barber Battle</title>
<link rel="preload" href="src/ui/fontes/fredoka-latin-700-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="src/ui/estilo.css">
<!-- Unico script externo permitido pela Poki. -->
<script src="https://game-cdn.poki.com/scripts/v2/poki-sdk.js"></script>
</head>
<body>
<canvas id="cena"></canvas>
<div id="hud">
  <div id="topo">
    <div id="faixaEsq" class="faixa rosa"><span id="rodadaTxt"></span></div>
    <div id="relogio" class="letreiro"><b id="tempo">0:00</b></div>
    <div id="faixaDir" class="faixa laranja"><span id="temaTxt"></span></div>
  </div>
  <div id="podioA" class="podio">
    <div class="nome"><span class="quem" id="nomeA"></span><span class="selo amarelo" id="seloA"></span></div>
    <div class="barras" id="barrasA">
      <div class="barra"><span id="cabeloTxtA"></span><div class="trilho"><i id="cabeloA"></i></div></div>
      <div class="barra teal"><span id="barbaTxtA"></span><div class="trilho"><i id="barbaA"></i></div></div>
      <div class="combo" id="comboA" hidden></div>
    </div>
    <div class="ferramentas" id="ferramentas"></div>
  </div>
  <div id="podioB" class="podio">
    <div class="nome"><span class="quem" id="nomeB"></span><span class="selo teal" id="seloB"></span></div>
    <div class="barras" id="barrasB">
      <div class="barra"><span id="cabeloTxtB"></span><div class="trilho"><i id="cabeloB"></i></div></div>
      <div class="barra teal"><span id="barbaTxtB"></span><div class="trilho"><i id="barbaB"></i></div></div>
      <div class="combo" id="comboB" hidden></div>
    </div>
    <div class="status" id="statusB"></div>
  </div>
  <div id="plateia">
    <button id="vaiA" class="vai laranja" type="button"></button>
    <div class="medidor" id="medidor"><i id="medA"></i><i id="medB"></i></div>
    <button id="vaiB" class="vai teal" type="button"></button>
    <div id="contador"></div>
  </div>
  <div id="reacoes"></div>
  <div id="balao" hidden></div>
  <button id="bMenu" class="btn" type="button" aria-label="Menu"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
</div>
<div id="saguao" hidden>
  <div class="cartao">
    <small id="saguaoRotulo"></small>
    <h2 id="saguaoTema"></h2>
    <div class="anel"><svg viewBox="0 0 100 100"><circle class="fundo" cx="50" cy="50" r="42"/><circle class="frente" id="saguaoAnel" cx="50" cy="50" r="42"/></svg><b id="saguaoTempo"></b></div>
    <div class="linha"><button class="acao grande" id="bJogar" type="button"></button><button class="acao clara" id="bAssistir" type="button"></button></div>
    <small id="saguaoFila"></small>
  </div>
</div>
<div id="votacao" hidden>
  <button class="votoBtn" id="votarA" type="button"></button>
  <button class="votoBtn" id="votarB" type="button"></button>
</div>
<div id="resultado" hidden>
  <div class="cartao">
    <h2 id="resultadoTitulo"></h2>
    <div class="placarFim"><b id="resultadoNome"></b><small id="resultadoPontos"></small></div>
    <button class="acao grande" id="bContinuar" type="button"></button>
    <button class="acao anuncio" id="bDobrar" type="button"></button>
  </div>
</div>
<div id="aviso" hidden><b id="avisoTxt"></b></div>
<div id="menu" hidden>
  <div class="cartao" role="dialog" aria-modal="true" aria-labelledby="menuTitulo">
    <header><h2 id="menuTitulo"></h2><button class="fechar" id="bFechar" type="button" aria-label="Close">✕</button></header>
    <div class="corpo">
      <button class="acao grande" id="bVoltar" type="button"></button>
      <div class="linha">
        <button class="acao clara" id="bSom" type="button"></button>
        <button class="acao clara" id="bIdioma" type="button"></button>
      </div>
      <h3 id="meuBarbeiroTitulo"></h3>
      <div class="linha"><span class="apelido" id="apelido"></span><button class="acao clara" id="bNovoNome" type="button"></button></div>
      <div class="chapeus" id="chapeus"></div>
      <div class="linha">
        <button class="acao clara" id="bPrivacidade" type="button"></button>
        <button class="acao clara" id="bSairCadeira" type="button"></button>
      </div>
    </div>
  </div>
</div>
<div id="anuncio" hidden><div class="cartao"><b id="anuncioTempo">3</b><span>ad</span></div></div>
<script type="module" src="src/main.js"></script>
</body>
</html>
